<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>网页版 CS1.6 · 开箱即玩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0b0b0b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .game-wrapper {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 20px 20px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #3a3a3a inset;
            max-width: 1000px;
            width: fit-content;
            margin: 16px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 450;
            background: #2d3b4c;
            border-radius: 16px;
            box-shadow: 0 0 0 2px #2e2e2e, 0 12px 28px rgba(0,0,0,0.7);
            cursor: crosshair;
            touch-action: none;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            color: #cfcfcf;
            background: #262626;
            padding: 12px 22px;
            border-radius: 60px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            font-weight: 500;
            flex-wrap: wrap;
            gap: 12px 18px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .status span {
            background: #3a3a3a;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            color: #eee;
            box-shadow: 0 2px 0 #0f0f0f;
        }
        .status i {
            font-style: normal;
            color: #ffd966;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .controls button {
            background: #3d3d3d;
            border: none;
            color: #f0f0f0;
            padding: 6px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 #1a1a1a;
            transition: 0.07s ease;
            cursor: pointer;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #555;
        }
        .controls button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #1a1a1a;
        }
        .controls button.reset-btn {
            background: #6d3b3b;
            border-color: #9f5a5a;
            color: #ffe1e1;
        }
        .controls button.reset-btn:active {
            background: #4f2a2a;
        }
        .badge {
            background: #2d2d2d;
            border-radius: 40px;
            padding: 0 14px;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge kbd {
            background: #111;
            color: #ccc;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        @media (max-width: 700px) {
            .game-wrapper { padding: 12px; }
            .info-panel { flex-direction: column; align-items: stretch; }
            .status { justify-content: center; }
            .controls { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="info-panel">
        <div class="status">
            <span>🔫 <i id="killCount">0</i></span>
            <span>🎯 <i id="hitCount">0</i></span>
            <span>⏱️ <i id="timeDisplay">0</i>s</span>
        </div>
        <div class="controls">
            <button class="reset-btn" id="resetGameBtn">↺ 重新开局</button>
            <div class="badge">
                <kbd>WASD</kbd> 移动 · <kbd>鼠标</kbd> 瞄准 · <kbd>左键</kbd> 射击
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 画布 & 上下文 ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const killSpan = document.getElementById('killCount');
        const hitSpan = document.getElementById('hitCount');
        const timeSpan = document.getElementById('timeDisplay');

        // ---------- 固定尺寸 ----------
        const W = 800, H = 450;

        // ---------- 游戏状态 ----------
        let game = {
            kills: 0,
            hits: 0,
            time: 0,               // 秒
            running: true,
        };

        // ---------- 玩家 ----------
        const player = {
            x: 400, y: 225,
            radius: 12,
            speed: 2.8,
            angle: 0,              // 弧度, 指向鼠标
        };

        // ---------- 敌人 ----------
        let enemies = [];
        const ENEMY_RADIUS = 10;
        const ENEMY_SPEED = 1.2;
        const MAX_ENEMIES = 10;
        const SPAWN_COOLDOWN = 38;  // 帧数间隔
        let spawnCounter = 0;

        // ---------- 子弹 ----------
        let bullets = [];
        const BULLET_SPEED = 7.5;
        const BULLET_RADIUS = 4;
        const MAX_BULLETS = 30;

        // ---------- 鼠标 / 键盘 ----------
        let mouseX = player.x, mouseY = player.y;
        let keys = {
            w: false, a: false, s: false, d: false
        };
        let shootPressed = false;
        let shootCooldown = 0;          // 帧计数
        const SHOOT_DELAY = 8;          // 帧

        // ---------- 帧率 / 时间 ----------
        let lastTimestamp = 0;
        let frameCounter = 0;
        let secondCounter = 0;

        // ---------- 辅助函数 ----------
        function clamp(v, min, max) {
            return Math.min(max, Math.max(min, v));
        }

        // ---------- 重置游戏 ----------
        function resetGame() {
            game.kills = 0;
            game.hits = 0;
            game.time = 0;
            game.running = true;
            player.x = 400;
            player.y = 225;
            player.angle = 0;
            enemies = [];
            bullets = [];
            spawnCounter = 0;
            shootCooldown = 0;
            frameCounter = 0;
            secondCounter = 0;
            mouseX = player.x;
            mouseY = player.y;
            // 重置键盘状态 (避免卡方向)
            keys.w = false; keys.a = false; keys.s = false; keys.d = false;
            shootPressed = false;
            // 开局立刻生成几个敌人
            for (let i = 0; i < 4; i++) {
                spawnEnemy();
            }
            updateUI();
        }

        // ---------- 生成敌人 (保证不重叠) ----------
        function spawnEnemy() {
            if (enemies.length >= MAX_ENEMIES) return;
            let attempts = 0;
            const maxAttempts = 60;
            let newX, newY, overlap;
            do {
                // 在画布边缘外生成，从边界进入
                const side = Math.floor(Math.random() * 4);
                const pad = 30;
                if (side === 0) { // 上
                    newX = Math.random() * W;
                    newY = -pad;
                } else if (side === 1) { // 右
                    newX = W + pad;
                    newY = Math.random() * H;
                } else if (side === 2) { // 下
                    newX = Math.random() * W;
                    newY = H + pad;
                } else { // 左
                    newX = -pad;
                    newY = Math.random() * H;
                }
                // 避免生成在玩家脸上
                const dx = newX - player.x;
                const dy = newY - player.y;
                const distToPlayer = Math.hypot(dx, dy);
                overlap = distToPlayer < 50;
                // 避免与其他敌人重叠
                if (!overlap) {
                    for (let e of enemies) {
                        if (Math.hypot(newX - e.x, newY - e.y) < ENEMY_RADIUS * 2.2) {
                            overlap = true;
                            break;
                        }
                    }
                }
                attempts++;
                if (attempts > maxAttempts) break;
            } while (overlap);

            enemies.push({
                x: newX,
                y: newY,
                radius: ENEMY_RADIUS,
                hp: 1,        // 一击必杀
            });
        }

        // ---------- 发射子弹 ----------
        function shootBullet() {
            if (shootCooldown > 0) return;
            if (bullets.length >= MAX_BULLETS) return;
            const angle = player.angle;
            bullets.push({
                x: player.x + Math.cos(angle) * (player.radius + 4),
                y: player.y + Math.sin(angle) * (player.radius + 4),
                vx: Math.cos(angle) * BULLET_SPEED,
                vy: Math.sin(angle) * BULLET_SPEED,
                radius: BULLET_RADIUS,
                life: 120,    // 帧
            });
            shootCooldown = SHOOT_DELAY;
        }

        // ---------- 更新 UI ----------
        function updateUI() {
            killSpan.textContent = game.kills;
            hitSpan.textContent = game.hits;
            timeSpan.textContent = Math.floor(game.time);
        }

        // ---------- 更新逻辑 (每一帧) ----------
        function update() {
            if (!game.running) return;

            // 1. 玩家移动
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1;
            if (keys.s) dy += 1;
            if (keys.a) dx -= 1;
            if (keys.d) dx += 1;
            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                dx = dx / len * player.speed;
                dy = dy / len * player.speed;
                player.x = clamp(player.x + dx, player.radius, W - player.radius);
                player.y = clamp(player.y + dy, player.radius, H - player.radius);
            }

            // 2. 玩家朝向 (鼠标)
            const dxMouse = mouseX - player.x;
            const dyMouse = mouseY - player.y;
            if (Math.hypot(dxMouse, dyMouse) > 0.5) {
                player.angle = Math.atan2(dyMouse, dxMouse);
            }

            // 3. 射击冷却
            if (shootCooldown > 0) shootCooldown--;
            if (shootPressed) {
                shootBullet();
            }

            // 4. 更新子弹
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                // 边界消失
                if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || b.life <= 0) {
                    bullets.splice(i, 1);
                    continue;
                }
                // 子弹与敌人碰撞 (一次子弹只击中一个敌人)
                let bulletUsed = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < b.radius + e.radius) {
                        // 击杀敌人
                        enemies.splice(j, 1);
                        game.kills++;
                        game.hits++;
                        bulletUsed = true;
                        // 额外生成一个敌人 (保持数量)
                        spawnEnemy();
                        break; // 子弹消失，跳出内层循环
                    }
                }
                if (bulletUsed) {
                    bullets.splice(i, 1);
                }
            }

            // 5. 敌人行为：向玩家移动 + 碰撞伤害 (触碰即死)
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dxE = player.x - e.x;
                const dyE = player.y - e.y;
                const distE = Math.hypot(dxE, dyE);
                if (distE > 0.5) {
                    const moveX = (dxE / distE) * ENEMY_SPEED;
                    const moveY = (dyE / distE) * ENEMY_SPEED;
                    e.x += moveX;
                    e.y += moveY;
                }
                // 边界限制 (防止跑太远)
                e.x = clamp(e.x, -40, W + 40);
                e.y = clamp(e.y, -40, H + 40);

                // 敌人碰到玩家 → 游戏结束
                const distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
                if (distToPlayer < player.radius + e.radius) {
                    game.running = false;
                    // 显示结束信息 (通过UI)
                    killSpan.textContent = game.kills + ' 💀';
                    return;
                }
            }

            // 6. 生成敌人 (周期性)
            spawnCounter++;
            if (spawnCounter >= SPAWN_COOLDOWN) {
                spawnCounter = 0;
                if (enemies.length < MAX_ENEMIES) {
                    spawnEnemy();
                }
            }

            // 7. 游戏时间 (每 60 帧约 1 秒)
            frameCounter++;
            if (frameCounter >= 60) {
                frameCounter = 0;
                game.time++;
                updateUI();
            }
            // 更新 UI (击杀/命中 实时)
            killSpan.textContent = game.kills;
            hitSpan.textContent = game.hits;
        }

        // ---------- 绘图 ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // ---- 背景 (地图风格) ----
            const grad = ctx.createRadialGradient(400, 200, 50, 400, 250, 500);
            grad.addColorStop(0, '#4d6a7a');
            grad.addColorStop(1, '#1e2b36');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            // 网格线 (战术感)
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
            for (let i = 0; i < H; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(W, i);
                ctx.stroke();
            }

            // ---- 子弹 ----
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#f5d742';
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffdd44';
                ctx.fill();
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffbb00';
                ctx.beginPath();
                ctx.arc(b.x-1, b.y-1, b.radius*0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // ---- 敌人 ----
            for (let e of enemies) {
                // 身体
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#b30000';
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#b33e3e';
                ctx.fill();
                ctx.fillStyle = '#6d1a1a';
                ctx.beginPath();
                ctx.arc(e.x-2, e.y-3, e.radius*0.5, 0, Math.PI * 2);
                ctx.fill();
                // 眼睛 (方向朝向玩家)
                const ang = Math.atan2(player.y - e.y, player.x - e.x);
                const eyeOff = 4;
                ctx.fillStyle = '#f0f0f0';
                ctx.beginPath();
                ctx.arc(e.x + Math.cos(ang-0.4)*eyeOff, e.y + Math.sin(ang-0.4)*eyeOff-1, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + Math.cos(ang+0.4)*eyeOff, e.y + Math.sin(ang+0.4)*eyeOff-1, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(e.x + Math.cos(ang-0.4)*eyeOff + Math.cos(ang)*1.5, e.y + Math.sin(ang-0.4)*eyeOff-1 + Math.sin(ang)*1.5, 1.5, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + Math.cos(ang+0.4)*eyeOff + Math.cos(ang)*1.5, e.y + Math.sin(ang+0.4)*eyeOff-1 + Math.sin(ang)*1.5, 1.5, 0, Math.PI*2);
                ctx.fill();
            }

            // ---- 玩家 ----
            ctx.shadowBlur = 24;
            ctx.shadowColor = '#3a9eff';
            // 身体
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#3c7fb0';
            ctx.fill();
            ctx.fillStyle = '#1f4a6b';
            ctx.beginPath();
            ctx.arc(player.x-2, player.y-3, player.radius*0.5, 0, Math.PI*2);
            ctx.fill();
            // 枪管 (指向鼠标)
            ctx.shadowBlur = 8;
            ctx.strokeStyle = '#2d2d2d';
            ctx.lineWidth = 5;
            ctx.beginPath();
            const gunLen = 22;
            ctx.moveTo(player.x + Math.cos(player.angle)*8, player.y + Math.sin(player.angle)*8);
            ctx.lineTo(player.x + Math.cos(player.angle)*gunLen, player.y + Math.sin(player.angle)*gunLen);
            ctx.stroke();
            ctx.strokeStyle = '#5a5a5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(player.x + Math.cos(player.angle)*8, player.y + Math.sin(player.angle)*8);
            ctx.lineTo(player.x + Math.cos(player.angle)*gunLen, player.y + Math.sin(player.angle)*gunLen);
            ctx.stroke();

            // 瞄准准星 (鼠标位置)
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ccff88';
            ctx.lineWidth = 1.5;
            const cross = 10;
            ctx.beginPath();
            ctx.moveTo(mouseX - cross, mouseY);
            ctx.lineTo(mouseX + cross, mouseY);
            ctx.moveTo(mouseX, mouseY - cross);
            ctx.lineTo(mouseX, mouseY + cross);
            ctx.stroke();

            // 如果游戏结束, 显示遮罩
            if (!game.running) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = 'bold 44px "Segoe UI", system-ui';
                ctx.fillStyle = '#ffbaba';
                ctx.shadowColor = '#b30000';
                ctx.shadowBlur = 30;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('☠ 你阵亡了', W/2, H/2 - 20);
                ctx.font = '22px sans-serif';
                ctx.fillStyle = '#dddddd';
                ctx.shadowBlur = 10;
                ctx.fillText('点击 "重新开局"', W/2, H/2 + 48);
                ctx.shadowBlur = 0;
            }
        }

        // ---------- 循环动画 ----------
        function gameLoop(now) {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- 事件监听 ----------
        // 鼠标移动 (瞄准)
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
            mouseX = clamp(mouseX, 0, W);
            mouseY = clamp(mouseY, 0, H);
        });

        // 鼠标离开canvas 不重置准星, 保持最后位置
        canvas.addEventListener('mouseleave', () => {
            // 不操作
        });

        // 射击 (鼠标按下/释放)
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                shootPressed = true;
                e.preventDefault();
            }
        });
        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                shootPressed = false;
            }
        });
        // 防止上下文菜单
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // 键盘
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
            // 按R键快速重置 (彩蛋)
            if (key === 'r') {
                resetGame();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // 重置按钮
        document.getElementById('resetGameBtn').addEventListener('click', resetGame);

        // 窗口失去焦点时 释放所有按键 (防止卡方向)
        window.addEventListener('blur', () => {
            keys.w = false; keys.a = false; keys.s = false; keys.d = false;
            shootPressed = false;
        });

        // ---------- 启动游戏 ----------
        resetGame(); // 初始敌人 + 状态
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
